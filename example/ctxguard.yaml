# ollama-ctxguard example config / 설정 예시
# Copy and edit / 복사해서 쓰세요: cp example/ctxguard.yaml ./ctxguard.yaml
# (serve and doctor read ./ctxguard.yaml when --config is not given)
# (serve·doctor 는 --config 를 주지 않으면 현재 폴더의 ctxguard.yaml 을 읽습니다)

# Ollama address / Ollama 주소
upstream: http://127.0.0.1:11434

# Address the proxy listens on. Default: reachable only from this computer (127.0.0.1).
# Opening it up (e.g. 0.0.0.0) lets anyone on the network use your local models (no auth).
# 프록시가 들을 주소. 기본은 내 컴퓨터(127.0.0.1)에서만 접속 가능.
# 0.0.0.0 등으로 열면 같은 네트워크의 누구나 로컬 모델을 쓸 수 있습니다(인증 없음).
listen: 127.0.0.1:11435

# Model name (or glob * ?) -> num_ctx.
# An exact name beats a glob; a more specific glob beats a less specific one.
# A name without a tag ("llama3.2") is treated as ":latest".
# Give a model only one value - Ollama reloads the model when the value changes.
# 모델 이름(또는 글롭 * ?) → num_ctx. 정확한 이름이 글롭보다, 더 구체적인 글롭이 우선합니다.
# 태그 없는 이름("llama3.2")은 ":latest" 로 봅니다. 같은 모델에 값을 하나만 두세요(값이 바뀌면 모델을 다시 올립니다).
models:
  "qwen3:*": 32768
  "llama3.2:3b": 16384

# Value for models not listed above. Remove or leave empty to leave requests untouched (server default).
# 목록에 없는 모델에 줄 값. 지우거나 비워 두면 손대지 않습니다(서버 기본값).
# default: 8192

# true turns a "truncated" verdict into an error (422 for non-streaming, an error chunk for streaming).
# suspect, near_limit and unknown are never blocked.
# true 면 "truncated" 판정을 오류로 바꿉니다(비스트리밍 422, 스트리밍 error 청크). 나머지 판정은 막지 않습니다.
strict: false

# Truncation detection tuning (usually leave as is) / 잘림 판정 조정값(보통은 그대로 두세요).
truncation:
  keep_slack: 8         # signature band width: num_ctx/2 .. num_ctx/2 + keep_slack / 서명 구간 폭
  bytes_per_token: 6    # input token estimate: UTF-8 bytes / this value (conservatively large) / 입력 토큰 추정
  ratio: 1.2            # "overflowed" when estimated input >= this multiple of evaluated tokens / 넘쳤다고 보는 배수
  reserve: 512          # tokens kept for generation when max_tokens is absent / max_tokens 가 없을 때 생성용으로 남길 토큰

# Max wait for upstream response headers (first model load can take tens of seconds).
# 업스트림 응답 헤더를 기다리는 최대 시간(첫 모델 로드는 수십 초 걸릴 수 있음)
upstream_timeout_seconds: 600

# Access log: json | text. With log_file, appends to the file instead of stderr (rotated to .1 over 10MB).
# 접근 로그: json | text. log_file 을 주면 stderr 대신 파일에 덧붙입니다(10MB 넘으면 .1 로 교체).
log_format: json
# log_file: ctxguard.log
