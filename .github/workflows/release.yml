# Build prebuilt executables when a version tag is pushed and attach them to the GitHub Release.
# Action versions are pinned to the same tags as ci.yml.
# Windows is not in the matrix yet: it has never been verified here (add it once a run passes).
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: 3.8.1
      - run: dart pub get
      - run: dart test
      # dart compile exe fails when the output folder is missing, so create it first.
      - run: mkdir -p build
      - run: dart compile exe bin/ollama_ctxguard.dart -o build/ollama-ctxguard-${{ github.ref_name }}-${{ matrix.target }}
      # Smoke test the built executable in practice mock mode (no Ollama needed).
      - run: ./build/ollama-ctxguard-${{ github.ref_name }}-${{ matrix.target }} --lang en demo
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ollama-ctxguard-${{ matrix.target }}
          path: build/ollama-ctxguard-${{ github.ref_name }}-${{ matrix.target }}
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Write permission only for the job that creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          chmod +x ollama-ctxguard-*
          sha256sum ollama-ctxguard-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
