# 실제 Ollama·모델 없이 연습용 목(가짜 Ollama)으로 전체 흐름을 검증한다.
# 액션 버전은 릴리스 페이지에서 확인한 태그로 고정(2026-11-11 확인).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 — 의존성·SDK 가 바뀌어 깨지지 않았는지 정기 확인
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: 3.8.1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      # 단일 실행 파일: dart compile exe 는 출력 폴더가 없으면 실패하므로 먼저 만든다.
      - run: mkdir -p build && dart compile exe bin/ollama_ctxguard.dart -o build/ollama-ctxguard
      - run: ./build/ollama-ctxguard demo
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ollama-ctxguard-linux-x64
          path: build/ollama-ctxguard
          retention-days: 14
